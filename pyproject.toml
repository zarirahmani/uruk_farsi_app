[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "requests>=2.33.1",
    "ruff>=0.15.12",
    "streamlit>=1.57.0",
    "streamlit-drawable-canvas>=0.9.3",
]


[project]
name = "farsi-app"
version = "0.1.0"
description = "AI-powered Farsi writing and handwriting tutor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pillow>=12.2.0",
    "numpy>=2.4.4",
    "python-multipart>=0.0.27",
    "pydantic>=2.13.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "opencv-python>=4.13.0.92",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]